name: Daily Horizon Summary

on:
  schedule:
    # GitHub cron uses UTC. 12:00 UTC = 07:00 America/New_York (EST) / 08:00 (EDT).
    # Scheduled runs may start a little late when GitHub is busy.
    - cron: '0 12 * * *'
  workflow_dispatch:      # Allow manual trigger

concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # Needed to push the generated site to the Pages branch
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          # OpenRouter free models (see ai section of data/config.github.json)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Higher GitHub API rate limit for the GitHub releases scraper
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep earlier daily summaries on the Pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: site
          enable_jekyll: true
